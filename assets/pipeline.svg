Brains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#ff8a3d">TEST</text><line x1="238.5" y1="88" x2="370.5" y2="88" stroke="#232834"/><text x="238.5" y="112" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#e8ebf2">GitHub Actions</text><text x="238.5" y="133" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">SonarQube</text><text x="238.5" y="154" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">Python · Bash</text><g class="chk x1"><circle cx="364.5" cy="46" r="9" fill="none" stroke="#3ecf8e" stroke-width="1.6"/><polyline points="360.0,46 363.5,49.5 369.0,42.5" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="304.5" y1="172" x2="304.5" y2="225" stroke="#2f3544" stroke-width="1.5"/><circle class="m1" cx="304.5" cy="232" r="7" fill="#090b10" stroke="#3a4152" stroke-width="2"/><rect class="k2" x="416.0" y="24" width="168" height="148" rx="14" fill="#0d1017" stroke="#232834" stroke-width="1.5"/><text x="434.0" y="48" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.2" fill="#565f72">STAGE_03</text><text x="434.0" y="76" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#ff8a3d">SCAN</text><line x1="434.0" y1="88" x2="566.0" y2="88" stroke="#232834"/><text x="434.0" y="112" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#e8ebf2">Trivy</text><text x="434.0" y="133" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">Container security</text><text x="434.0" y="154" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">Vuln assessment</text><g class="chk x2"><circle cx="560.0" cy="46" r="9" fill="none" stroke="#3ecf8e" stroke-width="1.6"/><polyline points="555.5,46 559.0,49.5 564.5,42.5" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="500.0" y1="172" x2="500.0" y2="225" stroke="#2f3544" stroke-width="1.5"/><circle class="m2" cx="500.0" cy="232" r="7" fill="#090b10" stroke="#3a4152" stroke-width="2"/><rect class="k3" x="611.5" y="24" width="168" height="148" rx="14" fill="#0d1017" stroke="#232834" stroke-width="1.5"/><text x="629.5" y="48" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" letter-spacing="1.2" fill="#565f72">STAGE_04</text><text x="629.5" y="76" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="17" font-weight="700" fill="#ff8a3d">DEPLOY</text><line x1="629.5" y1="88" x2="761.5" y2="88" stroke="#232834"/><text x="629.5" y="112" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#e8ebf2">Terraform</text><text x="629.5" y="133" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">Helm · ArgoCD</text><text x="629.5" y="154" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#8891a3">K8s · OpenShift</text><g class="chk x3"><circle cx="755.5" cy="46" r="9" fill="none" stroke="#3ecf8e" stroke-width="1.6"/><polyline points="751.0,46 754.5,49.5 760.0,42.5" fill="none" stroke="#3ecf8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="695.5" y1="172" x2="695.5" y2="225" stroke="#2f3544" stroke-width="1.5"/><circle class="m3" cx="695.5" cy="232" r="7" fill