<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="Delivery pipeline: build, test, scan, deploy, monitor with tools used at each stage">
<defs></defs>
<style>
.pulse{animation:travel 10.0s linear infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}2%{opacity:1}65.000%{transform:translateX(950px);opacity:1}70.000%{transform:translateX(950px);opacity:0}100%{transform:translateX(950px);opacity:0}}
.prog{stroke-dasharray:950;animation:prog 10.0s linear infinite}
@keyframes prog{0%{stroke-dashoffset:950;opacity:1}65.000%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:950;opacity:0}}
@keyframes lit{0%{stroke:#232834}2%{stroke:#3ecf8e}85%{stroke:#3ecf8e}92%{stroke:#232834}100%{stroke:#232834}}
@keyframes nodelit{0%{fill:#090b10;stroke:#3a4152}2%{fill:#3ecf8e;stroke:#3ecf8e}85%{fill:#3ecf8e;stroke:#3ecf8e}92%{fill:#090b10;stroke:#3a4152}100%{fill:#090b10;stroke:#3a4152}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}3%{opacity:1;transform:scale(1.25)}6%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1)}92%{opacity:0}100%{opacity:0}}
.chk{transform-box:fill-box;transform-origin:center}
.caption{animation:cap 1.2s ease .3s both}
@keyframes cap{from{opacity:0}to{opacity:1}}
.k0{animation:lit 10.0s linear infinite backwards;animation-delay:0.57s}.m0{animation:nodelit 10.0s linear infinite backwards;animation-delay:0.57s}.x0{animation:pop 10.0s linear infinite backwards;animation-delay:0.57s}.k1{animation:lit 10.0s linear infinite backwards;animation-delay:1.91s}.m1{animation:nodelit 10.0s linear infinite backwards;animation-delay:1.91s}.x1{animation:pop 10.0s linear infinite backwards;animation-delay:1.91s}.k2{animation:lit 10.0s linear infinite backwards;animation-delay:3.25s}.m2{animation:nodelit 10.0s linear infinite backwards;animation-delay:3.25s}.x2{animation:pop 10.0s linear infinite backwards;animation-delay:3.25s}.k3{animation:lit 10.0s linear infinite backwards;animation-delay:4.59s}.m3{animation:nodelit 10.0s linear infinite backwards;animation-delay:4.59s}.x3{animation:pop 10.0s linear infinite backwards;animation-delay:4.59s}.k4{animation:lit 10.0s linear infinite backwards;animation-delay:5.93s}.m4{animation:nodelit 10.0s linear infinite backwards;animation-delay:5.93s}.x4{animation:pop 10.0s linear infinite backwards;animation-delay:5.93s}</style>
